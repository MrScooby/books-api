services:
  postgres:
    image: postgres:16-alpine
    container_name: books-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
      POSTGRES_DB: books
    ports:
      - "5433:5432"
    volumes:
      - books-api-pgdata:/var/lib/postgresql/data

volumes:
  books-api-pgdata:
